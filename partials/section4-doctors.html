<section id="doctors" class="scroll-mt-[110px] w-full justify-center flex">
	<div
		class="w-full max-w-[1300px] min-w-[auto] flex flex-col lg:flex-row items-start justify-between py-[48px] pb-[24px] gap-[32px] lg:px-[24px] lg:py-[80px] lg:pb-0 lg:gap-[20px]">
		<div class="flex flex-col gap-[24px] w-full pb-[24px] xl:pb-0 text-[#4F4F4F]">
			<h2 class="text-[22px] lg:text-[32px] font-[800]">Наши врачи:</h2>

			<div class="xl:hidden">
				<div class="overflow-hidden touch-pan-y select-none" data-doctors-viewport>
					<div class="flex transition-transform duration-300 ease-out"
						data-doctors-track></div>
				</div>

				<div class="mt-[18px] flex items-center justify-center gap-[18px]" data-doctors-dots></div>
			</div>

			<div id="doctors-grid" class="hidden w-full grid-cols-1 gap-4 xl:grid xl:grid-cols-3"></div>
		</div>
	</div>

	<div data-doctor-modal-overlay
		class="pointer-events-none fixed inset-0 z-[85] bg-white/20 opacity-0 backdrop-blur-none transition duration-300">
		<div class="absolute inset-0" data-doctor-modal-close></div>

		<div data-doctor-modal-panel
			class="absolute inset-x-[8px] top-[10px] bottom-[10px] mx-auto flex max-w-[970px] -translate-y-4 flex-col overflow-y-auto rounded-[28px] bg-white px-[18px] pt-[76px] pb-[28px] opacity-0 shadow-[0_36px_120px_rgba(74,74,74,0.16)] transition duration-300 lg:inset-x-auto lg:left-1/2 lg:top-1/2 lg:bottom-auto lg:max-h-[calc(100vh-64px)] md:max-h-[745px] lg:w-[970px] lg:-translate-x-1/2 lg:-translate-y-[calc(50%+16px)] lg:rounded-[36px] lg:px-[46px] lg:py-[60px]">
			<button type="button" aria-label="Закрыть окно" data-doctor-modal-close
				class="absolute right-[16px] top-[16px] z-20 flex h-[42px] w-[42px] shrink-0 items-center justify-center rounded-full bg-[#F6F4F2] text-[42px] leading-none text-[#808080] transition-colors duration-200 hover:bg-[#EFEAE6] lg:right-[22px] lg:top-[18px] lg:h-[42px] lg:w-[42px]">
				<img src="./assets/cross.svg" alt="" class="w-[18px] h-[18px]" />
			</button>

			<div class="md:flex md:gap-[22px]">
				<div class="shrink-0 rounded-[22px] border border-[#D9D6D2] overflow-hidden bg-[#FBFAF8] lg:w-[480px] md:w-[356px]">
					<img data-doctor-modal-photo src="" alt="" class="h-auto w-full object-cover" />
				</div>

				<div class="mt-[20px] lg:mt-[10px] lg:flex-1">
					<h3 data-doctor-modal-surname
						class="text-[22px] uppercase font-[900] text-[#4F4F4F] lg:text-[32px]"></h3>
					<p data-doctor-modal-name
						class="mt-[10px] text-[20px] font-[700] text-[#5A5A5A] lg:mt-[6px] lg:text-[24px]">
					</p>

					<div data-doctor-modal-experience
						class="mt-[18px] inline-flex rounded-[12px] bg-[#F6F4F2] px-[18px] py-[9px] text-[16px] lg:text-[18px] leading-[1.1] text-[#6A6A6A]">
					</div>

					<ul data-doctor-modal-list class="mt-[24px] flex flex-col gap-[18px] text-[#555555]"></ul>

					<div class="mt-[18px] lg:mt-[24px]">
						<p class="text-[18px] font-[800] leading-[1.2] text-[#5A5A5A]">Образование:</p>
						<p data-doctor-modal-education
							class="mt-[6px] text-[18px] leading-[1.24] text-[#666666] lg:max-w-[320px]"></p>
					</div>
				</div>
			</div>

			<div class="mt-[42px] border-t border-[#E7E0D8] pt-[42px] lg:mt-[32px] lg:pt-[32px]">
				<div data-doctor-modal-form-section>
					<h4 class="text-[20px] font-[800] leading-[1.1] text-[#4F4F4F] lg:text-[24px]">Запишитесь на прием
					</h4>
					<p
						class="mt-[14px] max-w-[520px] text-[16px] leading-[1.22] text-[#5B5B5B] lg:mt-[12px] lg:text-[18px]">
						Оставьте ваш номер телефона —<br> администратор свяжется с вами в течение рабочего дня
					</p>

					<form data-contact-form data-doctor-modal-form data-form-source="doctor-modal"
						class="flex flex-col md:flex-row mt-[24px] md:mt-[36px] md:gap-[24px]">
						<input type="hidden" name="doctor" data-doctor-name-field />
						<div class="flex flex-col md:flex-row gap-[12px] lg:gap-[16px]">
							<input type="text" name="name" placeholder="ФИО" required
								class="h-[44px] border-0 rounded-[20px] lg:rounded-[16px] bg-[#F6F6F6] px-[16px] text-[16px] text-[#4F4F4F] placeholder:text-[#9A9A9A] focus:outline-none focus:ring-2 focus:ring-[#FF7948]/30 lg:h-[52px] lg:text-[18px] lg:px-[16px] lg:py-0 lg:pt-[5px]" />
							<input type="tel" name="phone" data-phone-input inputmode="tel"
								placeholder="+7 (000) 000-00-00" required
								class="h-[44px] border-0 rounded-[20px] bg-[#F6F6F6] px-[16px] text-[16px] text-[#4F4F4F] placeholder:text-[#9A9A9A] focus:outline-none focus:ring-2 focus:ring-[#FF7948]/30 lg:h-[52px] lg:text-[18px] lg:px-[16px] lg:py-[0px] lg:pt-[5px]" />
						</div>

						<button type="submit"
							class="mt-[32px] md:mt-[0px] inline-flex h-[44px] w-full items-center justify-center rounded-[16px] lg:rounded-[20px] bg-[#FF7848] px-[18px] text-[16px] lg:text-[18px] font-[600] text-white transition-colors duration-200 hover:bg-[#FF946D] lg:h-[52px] lg:text-[18px] lg:py-0 lg:pt-[5px]">
							Заказать звонок
						</button>
					</form>
					<p
						class="mt-[14px] lg:mt-[16px] max-w-[510px] text-[12px] md:max-w-full leading-[1.28] text-[#8A8A8A] lg:mt-[18px] lg:text-[13px]">
						Нажимая на кнопку, вы даете согласие на обработку персональных данных и соглашаетесь с
						<a href="#" class="underline underline-offset-[3px]">политикой конфиденциальности</a>
					</p>
				</div>
			</div>

			<div data-doctor-modal-sticky-cta
				class="pointer-events-none fixed inset-x-[10px] bottom-[10px] z-30 translate-y-4 rounded-[22px] bg-white p-[10px] opacity-0 shadow-[0_-10px_30px_rgba(255,255,255,0.92)] transition duration-200 md:inset-x-[46px] md:bottom-[18px]">
				<button type="button" data-doctor-modal-scroll-trigger
					class="h-[52px] w-full rounded-[18px] bg-[#FF7848] text-[17px] font-[600] text-white transition-colors duration-200 hover:bg-[#FF946D]">
					Заказать звонок
				</button>
			</div>
		</div>
	</div>
</section>
