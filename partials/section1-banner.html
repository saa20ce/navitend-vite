<section class="relative mt-4 flex w-full justify-center rounded-[20px] md:mx-0 md:rounded-none">
	<div id="banner-slider"
		class="touch-pan-y select-none relative h-[400px] w-full max-w-[1300px] min-w-0 overflow-hidden rounded-[20px] md:h-[360px] xl:h-[560px] md:rounded-[16px]">
		<div data-banner-mobile-track class="flex h-full md:hidden"></div>
		<div data-banner-tablet-track class="hidden h-full md:flex xl:hidden"></div>
		<div data-banner-desktop-track class="hidden h-full xl:flex"></div>
	</div>

	<div class="absolute bottom-[-32px] left-1/2 z-20 flex -translate-x-1/2 items-center gap-[28px] md:bottom-[-64px]">
		<button id="banner-prev" type="button" aria-label="Предыдущий баннер"
			class="hidden md:flex h-[40px] w-[40px] items-center justify-center cursor-pointer">
			<img src="./assets/chevronLeft.svg" alt="" class="w-[13px] h-[22px]" />
		</button>

		<div id="banner-dots" class="flex items-center gap-[28px]"></div>

		<button id="banner-next" type="button" aria-label="Следующий баннер"
			class="hidden md:flex h-[40px] w-[40px] items-center justify-center cursor-pointer">
			<img src="./assets/chevronRight.svg" alt="" class="h-auto w-auto" />
		</button>
	</div>
</section>
