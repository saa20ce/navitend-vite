<div data-contact-modal-overlay
	class="pointer-events-none fixed inset-0 z-[90] bg-white/20 opacity-0 backdrop-blur-none transition duration-300">
	<div class="absolute inset-0" data-contact-modal-close></div>

	<div data-contact-modal-panel
		class="absolute inset-x-[16px] top-[20px] mx-auto w-auto max-w-[623px] -translate-y-4 rounded-[28px] bg-white px-[24px] pt-[76px] pb-[28px] opacity-0 shadow-[0_36px_120px_rgba(74,74,74,0.16)] transition duration-300 lg:left-1/2 lg:right-auto lg:top-1/2 lg:w-[660px] lg:-translate-x-1/2 lg:-translate-y-[calc(50%+16px)] lg:rounded-[36px] lg:px-[46px] lg:py-[60px]">
		<div class="flex items-start justify-between gap-[16px]">
			<div class="pr-[10px]">
				<h3 class="text-[22px] lg:text-[32px] font-[800] leading-[1.08] text-[#4F4F4F]">
					Запишитесь на прием
				</h3>
				<p
					class="mt-[18px] w-full text-[16px] font-[500] leading-[1.22] text-[#5B5B5B] lg:mt-[16px] lg:text-[20px]">
					Оставьте ваш номер телефона —<br /> администратор свяжется с вами в течение рабочего дня
				</p>
			</div>

			<button type="button" aria-label="Закрыть окно" data-contact-modal-close
				class="absolute right-[24px] top-[28px] lg:right-[32px] lg:top-[32px] flex h-[36px] w-[36px] lg:h-[48px] lg:w-[48px] shrink-0 items-center justify-center rounded-full bg-[#F6F4F2] text-[42px] leading-none text-[#808080] transition-colors duration-200 hover:bg-[#EFEAE6] lg:h-[46px] lg:w-[46px]">
				<img src="./assets/cross.svg" class="w-auto" />
			</button>
		</div>

		<form data-contact-form data-contact-modal-form class="mt-[24px] lg:mt-[36px]">
			<div class="flex flex-col gap-[12px] lg:gap-[16px]">
				<input type="text" name="name" placeholder="ФИО" required
					class="h-[44px] border-0 rounded-[20px] lg:rounded-[16px] bg-[#F6F6F6] px-[16px] text-[16px] text-[#4F4F4F] placeholder:text-[#9A9A9A] focus:outline-none focus:ring-2 focus:ring-[#FF7948]/30 lg:h-[52px] lg:text-[18px] lg:px-[16px] lg:py-0 lg:pt-[5px]" />
				<input type="tel" name="phone" data-phone-input inputmode="tel" placeholder="+7 (000) 000-00-00"
					required
					class="h-[44px] border-0 rounded-[20px] bg-[#F6F6F6] px-[16px] text-[16px] text-[#4F4F4F] placeholder:text-[#9A9A9A] focus:outline-none focus:ring-2 focus:ring-[#FF7948]/30 lg:h-[52px] lg:text-[18px] lg:px-[16px] lg:py-[0px] lg:pt-[5px]" />
			</div>

			<button type="submit"
				class="mt-[32px] lg:mt-[24px] inline-flex h-[44px] w-full items-center justify-center rounded-[16px] lg:rounded-[20px] bg-[#FF7848] px-[18px] text-[16px] lg:text-[18px] font-[600] text-white transition-colors duration-200 hover:bg-[#ff6c37] lg:mt-[26px] lg:h-[52px] lg:text-[18px] lg:py-0 lg:pt-[5px]">
				Заказать звонок
			</button>

			<p
				class="mt-[14px] lg:mt-[16px] max-w-[510px] text-[12px] leading-[1.28] text-[#8A8A8A] lg:mt-[18px] lg:text-[13px]">
				Нажимая на кнопку, вы даете согласие на обработку персональных данных и соглашаетесь с
				<a href="#" class="underline underline-offset-[3px]">политикой конфиденциальности</a>
			</p>
		</form>
	</div>
</div>
