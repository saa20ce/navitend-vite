<section id="licenses" class="scroll-mt-[110px] flex w-full justify-center rounded-[20px] lg:rounded-none">
	<div class="w-full max-w-[1300px] min-w-[auto] px-[0px] py-[48px] lg:px-[24px] lg:py-[80px]">
		<h2 class="text-[22px] lg:text-[32px] text-[#4F4F4F] font-[800]">Лицензии:</h2>

		<div class="mt-[20px] lg:mt-[40px]">
			<div class="relative">
				<div class="overflow-hidden touch-pan-y select-none" data-licenses-viewport>
					<div class="flex gap-[14px] transition-transform duration-300 ease-out lg:gap-[18px]"
						data-licenses-track></div>
				</div>
			</div>

			<div class="mt-[18px] flex items-center justify-center gap-[22px] lg:mt-[28px]">
				<button type="button" aria-label="Предыдущий документ" data-licenses-prev
					class="hidden lg:flex h-[40px] w-[40px] items-center justify-center rounded-full text-[#8F8F8F] transition-colors duration-200 hover:text-white">
					<img src="./assets/chevronLeft.svg" alt="" class="h-[20px] w-auto opacity-80" />
				</button>

				<div class="flex items-center gap-[18px]" data-licenses-dots></div>

				<button type="button" aria-label="Следующий документ" data-licenses-next
					class="hidden lg:flex h-[40px] w-[40px] items-center justify-center rounded-full text-[#8F8F8F] transition-colors duration-200 hover:text-white">
					<img src="./assets/chevronRight.svg" alt="" class="h-[20px] w-auto opacity-80" />
				</button>
			</div>
		</div>
	</div>
</section>
